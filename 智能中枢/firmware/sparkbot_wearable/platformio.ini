[platformio]
default_envs = sparkbot_actual

[env:sparkbot_actual]
platform = espressif32
board = esp32-s3-sparkbot
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

build_flags =
  -DCORE_DEBUG_LEVEL=1

lib_deps =

[env:audio_probe]
platform = espressif32
board = esp32-s3-sparkbot
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DAUDIO_PROBE

lib_deps =

[env:audio_capture]
platform = espressif32
board = esp32-s3-sparkbot
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DAUDIO_CAPTURE

lib_deps =
  bblanchon/ArduinoJson@^6.21.5
