[platformio]
default_envs = sparkbot_actual

[env:sparkbot_actual]
platform = espressif32
board = esp32-s3-sparkbot
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

build_flags =
  -DCORE_DEBUG_LEVEL=1

lib_deps =

[env:audio_probe]
platform = espressif32
board = esp32-s3-sparkbot
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DAUDIO_PROBE

lib_deps =

[env:audio_capture]
platform = espressif32
board = esp32-s3-sparkbot
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DAUDIO_CAPTURE

lib_deps =
  bblanchon/ArduinoJson@^6.21.5

[env:lcd_test]
; TFT_eSPI 2.5.43 直写 SPI 寄存器，与 arduino-esp32 3.x 不兼容（_spi_user 会算成 0x10 崩溃）
; 锁到 platform 6.5.0 / core 2.0.14，本机已缓存，无需下载
platform = espressif32@6.5.0
board = esp32-s3-sparkbot
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DLCD_TEST
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MISO=-1
  -DTFT_MOSI=47
  -DTFT_SCLK=21
  -DTFT_CS=44
  -DTFT_DC=43
  -DTFT_RST=-1
  -DTFT_BL=46
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DTFT_INVERSION_ON
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_FONT6
  -DLOAD_FONT7
  -DLOAD_FONT8
  -DLOAD_GFXFF
  -DSMOOTH_FONT

lib_deps =
  bodmer/TFT_eSPI@^2.5.43

[env:fountain]
; 音乐电子喷泉：ES8311 麦克风 -> FFT -> ST7789 彩色竖条
; 与 lcd_test 同理，TFT_eSPI 2.5.43 必须跑在 core 2.0.x 上
platform = espressif32@6.5.0
board = esp32-s3-sparkbot
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DFOUNTAIN
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MISO=-1
  -DTFT_MOSI=47
  -DTFT_SCLK=21
  -DTFT_CS=44
  -DTFT_DC=43
  -DTFT_RST=-1
  -DTFT_BL=46
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DTFT_INVERSION_ON
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DSMOOTH_FONT

lib_deps =
  bodmer/TFT_eSPI@^2.5.43

[env:pet_voice]
; 桌宠语音固件 + 音乐喷泉：同一块屏、同一路麦克风
; AUDIO_CAPTURE 跑语音会话，PET_FOUNTAIN 打开喷泉显示，两者共用 I2S RX 数据
; 同 lcd_test / fountain：TFT_eSPI 2.5.43 必须跑在 core 2.0.x 上
platform = espressif32@6.5.0
board = esp32-s3-sparkbot
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DAUDIO_CAPTURE
  -DPET_FOUNTAIN
  -DPET_AUTO_VOICE
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MISO=-1
  -DTFT_MOSI=47
  -DTFT_SCLK=21
  -DTFT_CS=44
  -DTFT_DC=43
  -DTFT_RST=-1
  -DTFT_BL=46
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DTFT_INVERSION_ON
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DSMOOTH_FONT

lib_deps =
  bblanchon/ArduinoJson@^6.21.5
  bodmer/TFT_eSPI@^2.5.43
